<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0b0f" />

  <title>内容后台</title>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
</head>

<body>
  <!-- ============ 登录 ============ -->
  <div class="gate" id="gate" hidden>
    <form class="gate__card" id="login-form">
      <div>
        <h1 class="gate__title" style="font-size: 1.35rem">内容后台</h1>
        <p class="gate__lead" style="margin-top: 0.4rem">
          登录后可以修改站点上显示的个人信息，中英文各改一份。保存后刷新站点即可看到。
        </p>
      </div>

      <label class="field__label" for="password">管理密码</label>
      <input
        class="input"
        id="password"
        type="password"
        autocomplete="current-password"
        required
        autofocus
      />

      <button class="btn btn--primary" id="login-button" type="submit">登录</button>
      <p class="gate__msg" id="login-message" role="alert"></p>
    </form>
  </div>

  <!-- ============ 编辑器 ============ -->
  <div class="studio" id="studio" hidden>
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__badge">后台</span>
        <span>站点内容</span>
      </div>

      <div class="tabs" id="locale-tabs" role="group" aria-label="编辑语言"></div>

      <div class="topbar__spacer"></div>

      <div class="topbar__actions">
        <span class="status" id="status" role="status" aria-live="polite"></span>
        <a class="btn btn--ghost btn--sm" href="/" target="_blank" rel="noopener">预览站点</a>
        <button class="btn btn--ghost btn--sm" id="logout" type="button">退出</button>
        <button class="btn btn--primary" id="save" type="button" disabled>保存</button>
      </div>
    </header>

    <div class="workspace">
      <nav class="sidebar" id="sidebar" aria-label="内容分区"></nav>

      <main class="editor" id="editor">
        <div class="editor__head">
          <h2 id="section-title"></h2>
          <p id="section-desc"></p>
        </div>

        <!-- 表单由 assets/admin/admin.js 按 assets/admin/schema.js 生成 -->
        <form class="form" id="form" onsubmit="return false"></form>
      </main>

      <aside class="history">
        <div class="history__inner">
          <h2>修改历史</h2>
          <p class="history__empty" style="padding: 0">
            每次保存都会自动留一份快照，改错了点回去就行。
          </p>

          <div class="history__list" id="history"></div>

          <div class="history__tools">
            <button class="btn btn--ghost btn--sm" id="export" type="button">导出全部内容</button>
            <button class="btn btn--ghost btn--sm" id="import" type="button">从文件导入</button>
            <button class="btn btn--ghost btn--sm btn--danger" id="reset" type="button">
              恢复当前语言默认
            </button>
            <input type="file" id="import-file" accept="application/json,.json" hidden />
          </div>
        </div>
      </aside>
    </div>
  </div>

  <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

  <!-- 加载顺序有依赖：先工具函数，再语言包（内置默认值），再表单定义与接口封装 -->
  <script src="/assets/js/util.js"></script>
  <script src="/assets/js/content-zh.js"></script>
  <script src="/assets/js/content-en.js"></script>
  <script src="/assets/admin/schema.js"></script>
  <script src="/assets/admin/api.js"></script>
  <script src="/assets/admin/admin.js"></script>
</body>
</html>
