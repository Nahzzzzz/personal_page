# ============================================================
# Cloudflare Pages 配置
# ============================================================
# 纯静态站点：没有 Functions、没有 D1、没有密钥、没有构建步骤。
#   本地预览：npx wrangler pages dev
#   线上部署：npx wrangler pages deploy
#
# 只有 public/ 会被上传，wrangler.toml 和 package.json 都不上传。
# 部署步骤见 README 的「部署到 Cloudflare」。
# ============================================================

# 给编辑器用的配置项补全（npm install 之后才会有这个文件）
"$schema" = "./node_modules/wrangler/config-schema.json"

# Pages 项目名。站点当前挂在 https://personal-page-2xn.pages.dev
# （personal-page.pages.dev 已被别人占用，Cloudflare 自动加了后缀）
name = "personal-page"
compatibility_date = "2026-10-01"

# 静态文件目录：这个目录里的文件就是上线时的文件
pages_build_output_dir = "public"
